<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#F0622B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng điều hành — Phòng Hạ tầng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* ===================== CÀI ĐẶT GIAO DIỆN — áp dụng sớm để không nháy màu ===================== */
var CAI_MD={theme:'auto',accent:'#F0622B',ga:0.55,blur:24,bg:'hoanghon',r:18,ts:1,dense:false,motion:true,thuGon:false};
var CAI=Object.assign({},CAI_MD);
try{Object.assign(CAI,JSON.parse(localStorage.getItem('bdh_pc_cai')||'{}'));}catch(e){}
var NEN={
  hoanghon:{t:'Hoàng hôn',c:['#FF9A62','#FF5E9C','#8F7BFF']},
  bien:{t:'Biển',c:['#3BA4FF','#22D3EE','#6366F1']},
  aurora:{t:'Cực quang',c:['#A855F7','#22C55E','#06B6D4']},
  rung:{t:'Rừng',c:['#34D399','#A3E635','#0EA5A4']},
  hong:{t:'Phấn hồng',c:['#F9A8D4','#FDBA74','#C4B5FD']},
  dem:{t:'Đêm',c:['#1E3A8A','#7C3AED','#0F766E']},
  trang:{t:'Tối giản',c:['#CBD5E1','#E2E8F0','#D5DCE6']},
  nhan:{t:'Theo màu nhấn',c:null}
};
function hexRgb(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c}).join('');
  var n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function xoayMau(hex,deg){var c=hexRgb(hex).map(function(x){return x/255}),r=c[0],g=c[1],b=c[2];
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){var d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}
  return 'hsl('+Math.round((h+deg+360)%360)+','+Math.round(s*100)+'%,'+Math.round(l*100)+'%)';}
function luuCai(){try{localStorage.setItem('bdh_pc_cai',JSON.stringify(CAI));}catch(e){}}
function apDungCai(){
  var g=document.documentElement,s=g.style;
  var toi=CAI.theme==='dark'||(CAI.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  g.setAttribute('data-theme',toi?'dark':'light');
  g.setAttribute('data-dense',CAI.dense?'1':'0');
  g.setAttribute('data-motion',CAI.motion?'1':'0');
  g.setAttribute('data-thugon',CAI.thuGon?'1':'0');
  s.setProperty('--accent',CAI.accent);
  s.setProperty('--accent-rgb',hexRgb(CAI.accent).join(','));
  s.setProperty('--ga',CAI.ga);
  s.setProperty('--blur',CAI.blur+'px');
  s.setProperty('--r',CAI.r+'px');
  s.setProperty('--ts',CAI.ts);
  var n=NEN[CAI.bg]||NEN.hoanghon;
  var c=n.c||[CAI.accent,xoayMau(CAI.accent,45),xoayMau(CAI.accent,-60)];
  s.setProperty('--b1',c[0]);s.setProperty('--b2',c[1]);s.setProperty('--b3',c[2]);
}
apDungCai();
if(window.matchMedia){var _mq=matchMedia('(prefers-color-scheme: dark)');
  if(_mq.addEventListener)_mq.addEventListener('change',function(){if(CAI.theme==='auto')apDungCai();});}
</script>
<style>
/* =================================================================== TOKEN */
:root{
  --accent:#F0622B;--accent-rgb:240,98,43;--ga:.55;--blur:24px;--r:18px;--ts:1;
  --bg-base:#EEF1F6;
  --text:#17202C;--muted:#566477;--faint:#8794A6;
  --glass:rgba(255,255,255,var(--ga));
  --glass-strong:rgba(255,255,255,calc(var(--ga) + .3));
  --edge:rgba(255,255,255,.75);
  --stroke:rgba(20,30,45,.09);
  --hover:rgba(20,30,45,.05);
  --sheen:rgba(255,255,255,.28);
  --shadow:0 12px 40px rgba(20,30,45,.10),0 2px 6px rgba(20,30,45,.05);
  --ok:#16A34A;--ok-bg:rgba(22,163,74,.13);
  --bad:#DC2626;--bad-bg:rgba(220,38,38,.12);
  --warn:#D97706;--warn-bg:rgba(217,119,6,.14);
  --info:#2563EB;--info-bg:rgba(37,99,235,.12);
  --vio:#7C3AED;--vio-bg:rgba(124,58,237,.12);
}
[data-theme=dark]{
  --bg-base:#0B0F15;--text:#E8EDF4;--muted:#A3B0C2;--faint:#6F7C8F;
  --glass:rgba(24,29,38,var(--ga));--glass-strong:rgba(24,29,38,calc(var(--ga) + .3));
  --edge:rgba(255,255,255,.10);--stroke:rgba(255,255,255,.08);--hover:rgba(255,255,255,.05);
  --sheen:rgba(255,255,255,.06);--shadow:0 12px 40px rgba(0,0,0,.45);
  --ok:#22C55E;--bad:#F05252;--warn:#F59E0B;--info:#60A5FA;--vio:#A78BFA;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(14px * var(--ts));height:100%}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--text);background:var(--bg-base);
  height:100%;overflow:hidden;-webkit-font-smoothing:antialiased;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[data-theme=dark] option{background:#1A1F29;color:#E8EDF4}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--stroke);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--faint)}

/* ================================================================ NỀN */
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.62}
[data-theme=dark] .blob{opacity:.30}
.b1{width:50vw;height:50vw;left:-12vw;top:-14vw;background:var(--b1)}
.b2{width:42vw;height:42vw;right:-10vw;top:16vh;background:var(--b2)}
.b3{width:52vw;height:52vw;left:26vw;bottom:-26vw;background:var(--b3)}
[data-motion="1"] .b1{animation:troi1 28s ease-in-out infinite alternate}
[data-motion="1"] .b2{animation:troi2 34s ease-in-out infinite alternate}
[data-motion="1"] .b3{animation:troi3 30s ease-in-out infinite alternate}
@keyframes troi1{to{transform:translate(9vw,7vh) scale(1.12)}}
@keyframes troi2{to{transform:translate(-8vw,10vh) scale(.92)}}
@keyframes troi3{to{transform:translate(-6vw,-9vh) scale(1.08)}}
[data-motion="0"] *{transition:none!important;animation:none!important}

/* =============================================================== KÍNH */
.glass{background-color:var(--glass);
  background-image:linear-gradient(140deg,var(--sheen),transparent 42%,transparent 72%,rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(var(--blur)) saturate(175%);backdrop-filter:blur(var(--blur)) saturate(175%);
  border:1px solid var(--edge);border-radius:var(--r);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08)}
[data-theme=dark] .glass{box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.07)}

/* ============================================================== KHUNG */
.app{position:relative;z-index:1;display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;height:100vh;padding:14px;
  transition:grid-template-columns .25s}
[data-thugon="1"] .app{grid-template-columns:76px minmax(0,1fr)}
.side{display:flex;flex-direction:column;padding:14px 12px;overflow:hidden;min-height:0}
.brand{display:flex;gap:11px;align-items:center;padding:4px 6px 18px}
.logo{width:40px;height:40px;flex:0 0 40px;border-radius:13px;color:#fff;font-weight:700;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),rgba(var(--accent-rgb),.7));box-shadow:0 8px 18px rgba(var(--accent-rgb),.38)}
.brand-t{min-width:0}
.brand-t b{display:block;font-size:1.02rem;white-space:nowrap}
.brand-t span{display:block;font-size:.76rem;color:var(--muted);white-space:nowrap}
.ni{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:calc(var(--r)*.62);color:var(--muted);
  font-weight:500;position:relative;margin-bottom:3px;transition:background .15s,color .15s;text-align:left;white-space:nowrap}
.ni:hover{background:var(--hover);color:var(--text)}
.ni.on{background:rgba(var(--accent-rgb),.14);color:var(--accent);font-weight:600}
.ni.on::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.ni svg{width:20px;height:20px;flex:0 0 20px}
.ni .bd{margin-left:auto;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;border-radius:20px;padding:1px 7px}
.ni .bd.vg{background:var(--warn)}
[data-thugon="1"] .brand-t,[data-thugon="1"] .ni span.t,[data-thugon="1"] .sync{display:none}
[data-thugon="1"] .ni{justify-content:center;padding:11px 0}
[data-thugon="1"] .ni .bd{position:absolute;top:2px;right:6px;margin:0;padding:0 5px}
.nav-nhom{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:10px 12px 6px;font-weight:600}
[data-thugon="1"] .nav-nhom{visibility:hidden;height:10px;padding:0}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--stroke)}
.sync{font-size:.74rem;color:var(--faint);padding:8px 12px 4px;line-height:1.4}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;gap:14px}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 22px;flex:0 0 auto;z-index:5}
.top-t{min-width:0;flex:1}
.top-t h1{font-size:1.4rem;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.top-t span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:8px;width:min(400px,30vw);background:var(--hover);border:1px solid var(--stroke);
  border-radius:calc(var(--r)*.65);padding:0 10px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15)}
.search svg{width:17px;height:17px;color:var(--faint);flex:0 0 17px}
.search input{border:0;background:none;outline:none;flex:1;padding:9px 0;min-width:0}
kbd{font-family:inherit;font-size:.7rem;border:1px solid var(--stroke);border-radius:6px;padding:0 6px;color:var(--faint)}
.ib{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--muted);flex:0 0 40px;transition:background .15s}
.ib:hover{background:var(--hover);color:var(--text)}
.ib svg{width:19px;height:19px}
.ib.quay svg{animation:quay .8s linear infinite}
@keyframes quay{to{transform:rotate(360deg)}}
.sel{background:var(--hover);border:1px solid var(--stroke);border-radius:calc(var(--r)*.6);padding:8px 10px;outline:none;font-weight:600;cursor:pointer}
.sel.sm{padding:6px 9px;font-weight:500;font-size:.84rem}
.sel.on{border-color:var(--accent);color:var(--accent);background:rgba(var(--accent-rgb),.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:calc(var(--r)*.6);
  background:var(--accent);color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(var(--accent-rgb),.32);white-space:nowrap;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55}
.btn svg{width:17px;height:17px}
.btn.ghost{background:var(--hover);color:var(--text);box-shadow:none;border:1px solid var(--stroke)}
.btn.sm{padding:6px 12px;font-size:.84rem}
.noi-dung{flex:1;overflow:auto;min-height:0;padding:0 2px 24px}

/* ============================================================= LƯỚI THẺ */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
@media(max-width:1360px){.c3,.c4{grid-column:span 6}.c5,.c7,.c8,.c9{grid-column:span 12}}
@media(max-width:980px){.grid>*{grid-column:span 12}.app{grid-template-columns:76px minmax(0,1fr)}
  .brand-t,.ni span.t,.sync,.nav-nhom{display:none}.ni{justify-content:center}.search{width:auto;flex:1}}
.card{padding:16px 18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:28px}
.card-h h2{font-size:1rem;font-weight:600}
.card-h .ghi{font-size:.78rem;color:var(--faint);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:14px}
@media(max-width:1360px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{text-align:left;padding:15px 16px;transition:transform .18s;display:block;width:100%}
.kpi:hover{transform:translateY(-2px)}
.kpi .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:11px}
.kpi .ic svg{width:18px;height:18px}
.kpi b{display:block;font-size:2rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .n{font-size:.86rem;color:var(--muted);margin-top:4px}
.kpi .p{font-size:.75rem;color:var(--faint);margin-top:2px}
.kpi .mini{height:5px;border-radius:9px;background:var(--hover);margin-top:9px;overflow:hidden}
.kpi .mini i{display:block;height:100%;background:var(--ok);border-radius:9px}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-bad{background:var(--bad-bg);color:var(--bad)}
.t-warn{background:var(--warn-bg);color:var(--warn)}.t-info{background:var(--info-bg);color:var(--info)}
.t-vio{background:var(--vio-bg);color:var(--vio)}.t-acc{background:rgba(var(--accent-rgb),.14);color:var(--accent)}

/* =============================================================== NHÃN */
.g{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.74rem;font-weight:600;white-space:nowrap;line-height:1.6}
.g-ok{background:var(--ok-bg);color:var(--ok)}.g-bad{background:var(--bad-bg);color:var(--bad)}
.g-warn{background:var(--warn-bg);color:var(--warn)}.g-info{background:var(--info-bg);color:var(--info)}
.g-vio{background:var(--vio-bg);color:var(--vio)}.g-mute{background:var(--hover);color:var(--muted)}
.g-acc{background:rgba(var(--accent-rgb),.14);color:var(--accent)}
.g-red{background:var(--bad);color:#fff}.g-khan{background:#8E1B15;color:#fff}

/* =============================================================== BẢNG */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{padding:6px 13px;border-radius:20px;font-size:.84rem;font-weight:500;color:var(--muted);background:var(--hover);
  border:1px solid var(--stroke);white-space:nowrap;transition:background .15s,color .15s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip .c{opacity:.75;margin-left:5px;font-variant-numeric:tabular-nums}
.sp{flex:1}
.tom{font-size:.82rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.tom b{color:var(--text);font-variant-numeric:tabular-nums}
.tbl-w{overflow:auto;max-height:calc(100vh - 290px);border-radius:calc(var(--r)*.7)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem}
.tbl th{position:sticky;top:0;z-index:1;text-align:left;font-weight:600;font-size:.72rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;padding:11px 12px;background:var(--glass-strong);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--stroke);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th:hover{color:var(--text)}
.tbl th .mt{color:var(--accent);margin-left:3px}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--stroke);vertical-align:top}
[data-dense="1"] .tbl td{padding:6px 10px}
[data-dense="1"] .tbl .sub{display:none}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:rgba(var(--accent-rgb),.07)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .ty{font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:260px;max-width:560px}
.tbl .sub{font-size:.78rem;color:var(--faint);margin-top:2px}
.mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.pag{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:12px;font-size:.84rem;color:var(--muted);flex-wrap:wrap}
.pag button{min-width:32px;height:32px;border-radius:9px;padding:0 8px;background:var(--hover);border:1px solid var(--stroke);font-variant-numeric:tabular-nums}
.pag button.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.pag button:disabled{opacity:.4;cursor:default}

/* ============================================================ BIỂU ĐỒ */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--stroke);stroke-dasharray:3 4}
.chart .ax{fill:var(--faint);font-size:11px;font-family:'Be Vietnam Pro',system-ui,sans-serif}
.chart .val{fill:var(--muted);font-size:11px;font-weight:600;font-family:'Be Vietnam Pro',system-ui,sans-serif}
.chart .hit{fill:transparent}
.chart .cot{cursor:pointer}
.chart .cot:hover .hit{fill:var(--hover)}
.chart .ln{fill:none;stroke:var(--info);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chart .dt{fill:var(--glass-strong);stroke:var(--info);stroke-width:2}
.s-ok{fill:var(--accent)}.s-acc{fill:rgba(var(--accent-rgb),.32)}.s-bad{fill:var(--bad)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);margin-top:10px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dn{display:flex;gap:20px;align-items:center}
.dn svg{flex:0 0 auto}
.dn circle{transition:stroke-width .15s}
.dn circle[data-tip]:hover{stroke-width:20}
.dn-l{flex:1;min-width:0;font-size:.86rem}
.dn-l div{display:flex;align-items:center;gap:8px;padding:4px 0}
.dn-l i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.dn-l span{flex:1;color:var(--muted)}
.dn-l b{font-variant-numeric:tabular-nums}
.dn-l em{font-style:normal;color:var(--faint);font-size:.76rem;width:44px;text-align:right}
.hb{margin-bottom:12px}.hb:last-child{margin-bottom:0}
.hb.btn-hb{width:100%;text-align:left;display:block;border-radius:10px;padding:4px 6px;margin:0 -6px 8px;width:calc(100% + 12px)}
.hb.btn-hb:hover{background:var(--hover)}
.hb .d{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;margin-bottom:5px}
.hb .d span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .d span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rail{height:8px;border-radius:20px;background:var(--hover);overflow:hidden;display:flex}
.rail i{display:block;height:100%}
.cols14{display:flex;gap:5px;align-items:stretch;height:170px}
.cols14 .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;border-radius:9px;padding:3px 0;min-width:0}
.cols14 .c:hover{background:var(--hover)}
.cols14 .th{width:62%;max-width:26px;border-radius:6px 6px 3px 3px;background:rgba(var(--accent-rgb),.45);min-height:3px}
.cols14 .c.qua .th{background:var(--bad)}
.cols14 .c.nay .th{background:var(--accent)}
.cols14 .c.trong .th{background:var(--stroke)}
.cols14 .v{font-size:.74rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cols14 .l{font-size:.66rem;color:var(--faint);line-height:1.2;text-align:center;white-space:nowrap}
.cols14 .c.cn .l{color:var(--bad)}
.ds-nho{display:flex;flex-direction:column}

function niceMax(v){var p=Math.pow(10,Math.floor(Math.log10(Math.max(v,1)))),n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
function chartThang(tt){
  var W=760,H=270,pl=36,pr=12,pt=20,pb=30,iw=W-pl-pr,ih=H-pt-pb;
  var max=niceMax(Math.max.apply(null,tt.map(function(x){return x.tong;}).concat([4])));
  var bw=iw/12, w=Math.min(36,bw*.56), g='', tN=new Date().getMonth()+1, laNay=NAM===new Date().getFullYear();
  for(var i=0;i<=4;i++){var y=pt+ih-ih*i/4;
    g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" class="gl"/><text x="'+(pl-8)+'" y="'+(y+4)+'" class="ax" text-anchor="end">'+Math.round(max*i/4)+'</text>';}
  var diem=[];

    var cx=pl+bw*i+bw/2, dang=x.tong-x.xong-x.tre, y=pt+ih;
    var seg=function(v,cls){ if(!v) return ''; var hh=ih*v/max; y-=hh;
      return '<rect x="'+(cx-w/2)+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="3" class="'+cls+'"/>'; };
    var bars=seg(x.xong,'s-ok')+seg(dang,'s-acc')+seg(x.tre,'s-bad');
    var tyle=x.tong?Math.round(x.xong/x.tong*100):null;
    if(tyle!==null) diem.push([cx,pt+ih-ih*tyle/100,tyle]);
    g+='<g class="cot" data-act="kpi" data-k="thang" data-v="'+x.thang+'" data-tip="Tháng '+x.thang+': '+x.tong+' hồ sơ<br>Hoàn thành '+x.xong
      +' · Đang xử lý '+dang+' · Trễ '+x.tre+(tyle!==null?'<br>Tỷ lệ hoàn thành '+tyle+'%':'')+'">'
      +'<rect x="'+(cx-bw/2)+'" y="'+pt+'" width="'+bw+'" height="'+ih+'" rx="6" class="hit"/>'+bars
      +(x.tong?'<text x="'+cx+'" y="'+(y-6)+'" class="val" text-anchor="middle">'+x.tong+'</text>':'')
      +'<text x="'+cx+'" y="'+(H-9)+'" class="ax" text-anchor="middle"'+(laNay&&x.thang===tN?' style="fill:var(--accent);font-weight:700"':'')+'>T'+x.thang+'</text></g>';
  });
  if(diem.length>1){
    g+='<path class="ln" style="opacity:.55" d="M'+diem.map(function(p){return p[0]+' '+p[1];}).join(' L')+'"/>';
    g+=diem.map(function(p){return '<circle class="dt" cx="'+p[0]+'" cy="'+p[1]+'" r="3" style="opacity:.8;pointer-events:none"/>';}).join('');
  }

    +'<div class="lg"><span><i style="background:var(--accent)"></i>Hoàn thành</span><span><i style="background:rgba(var(--accent-rgb),.32)"></i>Đang xử lý</span>'
    +'<span><i style="background:var(--bad)"></i>Trễ hạn</span><span><i style="background:var(--info);height:3px;border-radius:2px;vertical-align:3px"></i>Tỷ lệ hoàn thành (thang 0–100%)</span></div>';
}
function donut(seg,size,giua,phu){
  var r=size/2-12, c=2*Math.PI*r, tot=seg.reduce(function(a,s){return a+s.v;},0), off=0, sz=size/2;
  var arcs=tot?seg.filter(function(s){return s.v;}).map(function(s){
    var L=c*s.v/tot, a='<circle r="'+r+'" cx="'+sz+'" cy="'+sz+'" fill="none" style="stroke:'+s.c+'" stroke-width="15" stroke-dasharray="'
      +(L-1.5).toFixed(2)+' '+(c-L+1.5).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+sz+' '+sz+')" data-tip="'
      +esc(s.t)+': '+s.v+' ('+Math.round(s.v/tot*100)+'%)"/>'; off+=L; return a; }).join(''):'';
  var svg='<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    +'<circle r="'+r+'" cx="'+sz+'" cy="'+sz+'" fill="none" style="stroke:var(--hover)" stroke-width="15"/>'+arcs
    +'<text x="50%" y="'+(sz-4)+'" text-anchor="middle" style="fill:var(--text);font:700 '+(size*.17)+'px Be Vietnam Pro, system-ui, sans-serif">'+giua+'</text>'
    +'<text x="50%" y="'+(sz+size*.12)+'" text-anchor="middle" style="fill:var(--faint);font:500 11px Be Vietnam Pro, system-ui, sans-serif">'+phu+'</text></svg>';
  var lg='<div class="dn-l">'+seg.map(function(s){return '<div><i style="background:'+s.c+'"></i><span>'+esc(s.t)+'</span><b>'+s.v+'</b><em>'
    +(tot?Math.round(s.v/tot*100):0)+'%</em></div>';}).join('')+'</div>';
  return '<div class="dn">'+svg+lg+'</div>';
}

/* =========================================================================== HỒ SƠ */
function locHS(d){
  var L=HS.loc, b=HS.bl;
  if(L==='chuaxong'&&d.tt==='hoanthanh') return false;
  if(L==='trehan'&&d.tt!=='trehan') return false;
  if(L==='saphan'&&d.tt!=='saphan') return false;
  if(L==='cofile'&&!d.coFile) return false;
  if(L==='khongfile'&&d.coFile) return false;
  if(b.thang&&d.thang!==+b.thang) return false;
  if(b.quy&&Math.ceil(d.thang/3)!==+b.quy) return false;
  if(b.loai&&d.loai!==b.loai) return false;
  if(b.tinhTrang&&d.tinhTrang!==b.tinhTrang) return false;
  if(b.dangTai&&d.dangTai!==b.dangTai) return false;
  if(b.ketQua&&d.ketQua!==b.ketQua) return false;
  if(b.coQuan&&d.coQuan!==b.coQuan) return false;
  return true;
}
var TRUONG_HS=['ma','nhiemVu','kyHieu','trichYeu','dangTai','coQuan','luuTru','tinhTrang','loai'];
function dsHoSo(){
  var nguon=(TIMTATCA&&KQTIM)?KQTIM.hoSo:DL.hoSo.dong;
  var ds=nguon.filter(function(d){return locHS(d)&&khop(d,TRUONG_HS);});
  return {nguon:nguon,ds:sapXep(ds,HS)};
}
function sapXep(ds,s){
  var k=s.sx, c=s.chieu;
  return ds.slice().sort(function(a,b){
    var x=a[k], y=b[k];
    if(k==='conLai'){ x=a.tt==='hoanthanh'||x===null?99999:x; y=b.tt==='hoanthanh'||y===null?99999:y; }
    if(k==='ma'||k==='soHieu') return c*String(x).localeCompare(String(y),'vi',{numeric:true});
    if(typeof x==='boolean'){x=x?1:0;y=y?1:0;}
    if(x===''||x===null||x===undefined) return 1; if(y===''||y===null||y===undefined) return -1;
    return c*(typeof x==='number'?x-y:String(x).localeCompare(String(y),'vi'));
  });
}
function giaTri(k){var m={};DL.hoSo.dong.forEach(function(d){if(d[k])m[d[k]]=1;});return Object.keys(m).sort();}
function selLoc(k,nhan,ds){
  var gt=HS.bl[k];
  return '<select class="sel sm'+(gt?' on':'')+'" data-chg="bl" data-k="'+k+'"><option value="">'+nhan+'</option>'
    +ds.map(function(x){var v=x.v!==undefined?x.v:x,t=x.t||x;return '<option value="'+esc(v)+'"'+(String(v)===String(gt)?' selected':'')+'>'+esc(t)+'</option>';}).join('')+'</select>';
}
function coLocHS(){return HS.loc||Object.keys(HS.bl).some(function(k){return HS.bl[k];});}

function phanTrang(ds,s){
  var tong=Math.max(1,Math.ceil(ds.length/s.co)); if(s.trang>tong) s.trang=tong;
  var a=(s.trang-1)*s.co;
  return {ds:ds.slice(a,a+s.co),pag:function(k){
    var nut=[], p=s.trang, add=function(i){nut.push('<button class="'+(i===p?'on':'')+'" data-act="trangso" data-s="'+k+'" data-p="'+i+'">'+i+'</button>');};
    var tu=Math.max(1,p-2), den=Math.min(tong,p+2);
    if(tu>1){add(1); if(tu>2) nut.push('<span>…</span>');}
    for(var i=tu;i<=den;i++) add(i);
    if(den<tong){ if(den<tong-1) nut.push('<span>…</span>'); add(tong); }
    return '<div class="pag"><span>'+(a+1)+'–'+Math.min(a+s.co,ds.length)+' / '+ds.length+'</span>'
      +'<select class="sel sm" data-chg="co" data-s="'+k+'">'+[25,50,100,200].map(function(n){return '<option'+(n===s.co?' selected':'')+'>'+n+'</option>';}).join('')+'</select>'
      +'<button '+(p<=1?'disabled':'')+' data-act="trangso" data-s="'+k+'" data-p="'+(p-1)+'">‹</button>'+nut.join('')
      +'<button '+(p>=tong?'disabled':'')+' data-act="trangso" data-s="'+k+'" data-p="'+(p+1)+'">›</button></div>';
  }};
}
function ghimHS(d){
  if(d.tt==='hoanthanh') return '<span class="g g-ok">Hoàn thành'+(d.dungHan===false?' (trễ)':'')+'</span>';
  if(d.tt==='trehan') return '<span class="g g-bad">Trễ '+(-d.conLai)+' ngày</span>';
  if(d.tt==='saphan') return '<span class="g g-warn">'+(d.conLai===0?'Hết hạn hôm nay':'Còn '+d.conLai+' ngày')+'</span>';
  if(d.conLai===null) return '<span class="g g-mute">Chưa có hạn</span>';
  return '<span class="g g-info">Còn '+d.conLai+' ngày</span>';
}

/* ===================================================================== VĂN BẢN ĐẾN */
function locVB(d){
  var L=VB.loc;
  if(L==='canxuly'&&!(d.uu>=1&&d.hoanThanh!=='HOÀN THÀNH')) return false;
  if(L==='quahan'&&!(d.uu>=1&&d.conLai!==null&&d.conLai<0&&d.hoanThanh!=='HOÀN THÀNH')) return false;
  if(L==='khan'&&d.uu!==3) return false;
  if(L==='cothoihan'&&d.uu!==2) return false;
  if(L==='baocao'&&d.uu!==1) return false;
  if(L==='debiet'&&d.uu!==0) return false;
  if(L==='xong'&&d.hoanThanh!=='HOÀN THÀNH') return false;
  if(L==='cofile'&&!d.coFile) return false;
  if(VB.pl&&d.phanLoai!==VB.pl) return false;
  return true;
}

var LICH_TABS=[['hantra','Hạn trả hồ sơ'],['hop','Lịch họp'],['kehoach','Kế hoạch tuần'],['capphep','Cấp phép']];
function suKien(){
  var m={}, them=function(is,sk){ if(is) (m[is]=m[is]||[]).push(sk); };
  if(LT.tab==='hantra'){
    var da={};
    DL.hoSo.canXuLy.concat(DL.hoSo.dong).forEach(function(d){ if(da[d.ma]) return; da[d.ma]=1;
      them(d.hanIso,{nhan:d.ma+' · '+cat(d.trichYeu||d.nhiemVu,80),ma:d.ma,
        mau:d.tt==='hoanthanh'?'#16A34A':d.tt==='trehan'?'#DC2626':d.tt==='saphan'?'#D97706':'#2563EB',
        phu:[d.loai,d.dangTai,d.tt==='hoanthanh'?'Hoàn thành':d.conLai===null?'':d.conLai<0?'Trễ '+(-d.conLai)+' ngày':'Còn '+d.conLai+' ngày'].filter(Boolean).join(' · ')}); });
  } else if(LT.tab==='hop'){
    DL.lich.forEach(function(d){ them(d.ngayIso,{nhan:(d.gio?d.gio+' ':'')+d.tieuDe,mau:'#7C3AED',gio:d.gio,phu:[d.diaDiem,d.noiDung].filter(Boolean).join(' · ')}); });
  } else if(LT.tab==='kehoach'){
    DL.keHoach.viec.forEach(function(v){ them(v.ngayIso,{nhan:(v.batDau?v.batDau+' ':'')+v.tieuDe,gio:v.batDau,
      mau:v.uuTien==='Cao'?'#DC2626':v.uuTien==='Trung bình'?'#D97706':'#0EA5A4',phu:v.ghiChu||v.nguon}); });
  } else {
    DL.capPhep.forEach(function(d){ them(d.hanIso,{nhan:d.chuDauTu,mau:d.ketQua==='Hoàn thành'?'#16A34A':'#2563EB',
      phu:(d.ketQua||'Chưa có kết quả')+(d.capNhat?' · cập nhật '+d.capNhat:'')}); });
  }
  Object.keys(m).forEach(function(k){ m[k].sort(function(a,b){return (a.gio||'').localeCompare(b.gio||'');}); });
  return m;
}

function doiThang(k){
  LT.thang+=k; LT.ngay='';

  if(LT.tab==='hantra'&&LT.nam!==NAM&&DL.namList.indexOf(LT.nam)!==-1){ chonNam(LT.nam); return; }
  ve();
}
function veHomNay(){ var d=new Date(); LT.nam=d.getFullYear(); LT.thang=d.getMonth()+1; LT.ngay=DL.homNay;
  if(LT.tab==='hantra'&&LT.nam!==NAM&&DL.namList.indexOf(LT.nam)!==-1){ chonNam(LT.nam); return; } ve(); }

/* ========================================================================== BÁO CÁO */
function locKy(d,ky){
  if(!ky||ky==='nam') return true;
  if(ky.charAt(0)==='q') return Math.ceil(d.thang/3)===+ky.slice(1);
  if(ky.charAt(0)==='t') return d.thang===+ky.slice(1);
  return true;
}
function tenKy(ky){return ky==='nam'?'năm '+NAM:ky.charAt(0)==='q'?'quý '+ky.slice(1)+' năm '+NAM:'tháng '+ky.slice(1)+' năm '+NAM;}
function tinhTK(ds){
  var t={tong:ds.length,hoanThanh:0,dungHan:0,hoanThanhTre:0,dangXuLy:0,treHan:0,sapHan:0,coFile:0};
  ds.forEach(function(d){
    if(d.tt==='hoanthanh'){ t.hoanThanh++; if(d.dungHan===false) t.hoanThanhTre++; else t.dungHan++; }
    else { t.dangXuLy++; if(d.tt==='trehan') t.treHan++; if(d.tt==='saphan') t.sapHan++; }
    if(d.coFile) t.coFile++; });
  t.tyLe=t.tong?Math.round(t.hoanThanh/t.tong*1000)/10:0;
  return t;
}
function nhomTK(ds,k,md){
  var m={}; ds.forEach(function(d){ var key=d[k]||md; (m[key]=m[key]||[]).push(d); });
  return Object.keys(m).map(function(key){ var t=tinhTK(m[key]); t.ten=key; return t; }).sort(function(a,b){return b.tong-a.tong;});
}

function xuatCSV(loai){
  var cot,ds,ten;

    ds=ng.filter(function(d){return locVB(d)&&khop(d,['ma','soHieu','trichYeu','phanLoai']);});

      ['Tình trạng','tinhTrang'],['Hoàn thành','hoanThanh'],['Phân loại','phanLoai']];
    ten='Van_ban_den_'+NAM;
  } else {
    ds=loai==='baocao'?DL.hoSo.dong.filter(function(d){return locKy(d,BC.ky);}):dsHoSo().ds;
    cot=[['Số phiếu','ma'],['Tên nhiệm vụ','nhiemVu'],['Loại văn bản','loai'],['Ký hiệu','kyHieu'],['Trích yếu','trichYeu'],
      ['Ngày tiếp nhận','tiepNhan'],['Hạn trả','hanTra'],['Ngày hoàn thành','hoanThanhNgay'],['Tình trạng','tinhTrang'],
      ['Đang tại','dangTai'],['Kết quả','ketQua'],['Cơ quan ban hành','coQuan'],['Lưu trữ','luuTru'],['Có file','coFile']];
    ten=loai==='baocao'?'Bao_cao_'+BC.ky+'_'+NAM:'Ho_so_xu_ly_'+NAM;
  }
  var rows=[cot.map(function(c){return c[0];})].concat(ds.map(function(d){return cot.map(function(c){
    var v=d[c[1]]; if(v===true) v='Có'; if(v===false) v=''; return v===null||v===undefined?'':String(v);});}));
  var csv='\uFEFF'+rows.map(function(r){return r.map(function(v){return '"'+v.replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=ten+'.csv'; document.body.appendChild(a); a.click(); a.remove();

}

function guiFile(f){

}

function nhanCai(k,v){

  if(/sap (den |toi )?han|den han|hom nay|ngay mai|tuan nay|gan han/.test(k)){
    var gh=/tuan nay/.test(k)?7:/ngay mai/.test(k)?1:/hom nay/.test(k)?0:2;
    var sap=DL.hoSo.canXuLy.filter(function(x){return x.conLai!==null&&x.conLai>=0&&x.conLai<=gh;});
    return C(sap.length?'<b>'+sap.length+'</b> hồ sơ đến hạn trong '+(gh===0?'hôm nay':gh+' ngày tới')+':'+dsChat(sap,8):'Không có hồ sơ đến hạn trong '+(gh===0?'hôm nay':gh+' ngày tới')+'.'); }
  var ky=null;

    var tk=tinhTK(DL.hoSo.dong.filter(function(d){return locKy(d,ky||'nam');}));
    return C('Thống kê <b>'+(ky?tenKy(ky):'năm '+NAM)+'</b>: tiếp nhận <b>'+tk.tong+'</b>, hoàn thành <b>'+tk.hoanThanh+'</b> ('+so(tk.tyLe)+'%), đúng hạn '+tk.dungHan
      +', HT trễ '+tk.hoanThanhTre+', đang xử lý '+tk.dangXuLy+', quá hạn <b>'+tk.treHan+'</b>.<ul><li><button data-act="mobc" data-v="'+(ky||'nam')+'">Mở báo cáo chi tiết</button></li></ul>'); }
  if(/chua co file|khong co file|chua scan/.test(k)){ var kf=DL.hoSo.dong.filter(function(d){return !d.coFile;});
    return C(kf.length?'<b>'+kf.length+'</b> hồ sơ năm '+NAM+' chưa có file scan:'+dsChat(kf,8):'Tất cả hồ sơ năm '+NAM+' đều đã có file.'); }
  if(/lanh dao|van thu|chuyen vien|dang tai|dang o|cua ai/.test(k)){
    var noi=/uy ban/.test(k)?'Lãnh đạo Ủy ban':/lanh dao/.test(k)?'Lãnh đạo Phòng':/van thu/.test(k)?'Văn thư':/chuyen vien/.test(k)?'Chuyên viên':'';
    var cx=DL.hoSo.canXuLy.filter(function(x){return !noi||x.dangTai===noi;});
    if(!noi) return C('Hồ sơ chưa xong đang tại: '+nhomTK(DL.hoSo.canXuLy,'dangTai','Chưa rõ').map(function(x){return esc(x.ten)+' <b>'+x.tong+'</b>';}).join(', '));
    return C(cx.length?'<b>'+cx.length+'</b> hồ sơ đang tại <b>'+noi+'</b>:'+dsChat(cx,8):'Không có hồ sơ chưa xong tại '+noi+'.'); }
  if(/van ban/.test(k)){ var vb=DL.vanBan.canXuLy;
    return C(vb.length?'<b>'+vb.length+'</b> văn bản đến cần xử lý:<ul>'+vb.slice(0,6).map(function(d){
      return '<li><button data-act="xem" data-bang="vanban" data-ma="'+esc(d.ma)+'">'+esc(d.soHieu)+'</button> '+esc(cat(d.trichYeu,70))
        +'<small>'+esc((NHAN_UU[d.tinhTrang]||d.tinhTrang)+(d.conLai===null?'':d.conLai<0?' · trễ '+(-d.conLai)+' ngày':' · còn '+d.conLai+' ngày'))+'</small></li>';}).join('')+'</ul>'
      :'Không có văn bản đến nào cần xử lý.'); }
  var tu=k.replace(/^(tim|tra cuu|tim kiem|ho so|cho toi|xem)\s+/,'').trim();
  var kh=tatCaHS().filter(function(d){return kd([d.ma,d.nhiemVu,d.kyHieu,d.trichYeu,d.coQuan].join(' | ')).indexOf(tu)!==-1;});
  if(tu.length>=2&&kh.length) return {h:'Tìm thấy <b>'+kh.length+'</b> hồ sơ khớp "'+esc(q)+'":'+dsChat(kh,6)

  return {h:'',chac:false,bc:boiCanhAI([])};
}

  else if(c==='co'){ var s=el.dataset.s==='hs'?HS:VB; s.co=+el.value; s.trang=1; ve(); }

  else if(c==='kythang'){ BC.ky=el.value?'t'+el.value:'nam'; ve(); }
  else if(c==='thloai') doiLoaiTH();
  else if(c==='thtn') doiNgayTN();
  else if(c==='thhan') TH.hanSua=true;
  else if(c==='tep'){ if(el.files.length){ guiFile(el.files[0]); el.value=''; } }
});
document.addEventListener('input',function(e){
  var el=e.target, c=el.dataset&&el.dataset.inp; if(!c) return;
  if(c==='cai'){ var k=el.dataset.k, v=el.type==='range'?+el.value:el.value; datCai(k,v);
    var lb=document.getElementById('v-'+k); if(lb) lb.textContent=nhanCai(k,v);
    if(k==='accent') document.querySelectorAll('.sw button').forEach(function(b){b.classList.remove('on');}); }
  if(c==='thkh') TH.khSua=true;
});
var _hen;
$('#tim').addEventListener('input',function(){
  TIM=this.value.trim(); HS.trang=1; VB.trang=1; clearTimeout(_hen);
  if(TRANG!=='hoso'&&TRANG!=='vanban'&&TIM){ TRANG='hoso'; veNav(); }
  _hen=setTimeout(function(){ if(TIMTATCA) timServer(); else ve(); },TIMTATCA?420:160);
});
function timServer(){
  if(!TIM){ KQTIM=null; ve(); return; }
  DANGTIM=true; ve(); var q=TIM;
  goi('timToanBo',q,{}).then(function(kq){ DANGTIM=false; if(q!==TIM) return; if(kq.ok) KQTIM=kq; ve(); })
    .catch(function(){ DANGTIM=false; ve(); });
}
document.addEventListener('keydown',function(e){
  var dangGo=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='Escape'){ if($('#doc').classList.contains('on')) dongDoc(); else if($('#drawer').classList.contains('on')) dongDrawer(); else if(dangGo) document.activeElement.blur(); }
  if((e.key==='/'&&!dangGo)||(e.key==='k'&&(e.ctrlKey||e.metaKey))){ e.preventDefault(); $('#tim').focus(); }
  if(!dangGo&&!$('#drawer').classList.contains('on')&&/^[1-5]$/.test(e.key)) diTrang(TRANGS[+e.key-1].id);
});
/* chú thích khi rê chuột */
var TIP=$('#tip');
document.addEventListener('mouseover',function(e){ var el=e.target.closest&&e.target.closest('[data-tip]');
  if(el){ TIP.innerHTML=el.getAttribute('data-tip'); TIP.classList.add('on'); } else TIP.classList.remove('on'); });
document.addEventListener('mousemove',function(e){ if(!TIP.classList.contains('on')) return;
  var x=e.clientX+14, y=e.clientY+16, w=TIP.offsetWidth, h=TIP.offsetHeight;
  if(x+w>innerWidth-8) x=e.clientX-w-12; if(y+h>innerHeight-8) y=e.clientY-h-12;
  TIP.style.left=x+'px'; TIP.style.top=y+'px'; });

/* ======================================================================== TIỆN ÍCH */
function toast(s,loi){ var e=document.createElement('div'); e.className='toast'+(loi?' loi':''); e.textContent=s; document.body.appendChild(e);
  setTimeout(function(){e.style.opacity='0';},2400); setTimeout(function(){e.remove();},2700); }
function kd(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim();}
function khop(d,truong){ if(!TIM) return true; var k=kd(TIM); return truong.some(function(t){return kd(d[t]).indexOf(k)!==-1;}); }
function cat(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s;}
function esc(s){return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dmy(d){return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function dauNgay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function congNgay(is,n){var p=is.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]+n);return iso(d);}
function pt(a,b){return b?Math.round(a/b*1000)/10:0;}
function so(x){return String(x).replace('.',',');}
